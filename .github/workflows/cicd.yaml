name: Build Push and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-push-deploy:

    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Configure Docker PATH
      # --------------------------------------------------
      - name: Configure Docker
        shell: powershell
        run: |

          $dockerPath = "C:\Users\BoggalaSaiJayaram\AppData\Local\Programs\DockerDesktop\resources\bin"

          $dockerExe = "$dockerPath\docker.exe"

          Write-Host "Docker path:"
          Write-Host $dockerPath

          Write-Host "Docker executable:"
          Write-Host $dockerExe

          if (!(Test-Path $dockerExe)) {
              Write-Error "Docker executable not found"
              exit 1
          }

          # Make Docker available to all following steps
          Add-Content -Path $env:GITHUB_PATH -Value $dockerPath

          # Also save the absolute path
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_EXE=$dockerExe"

          Write-Host "Docker configuration completed."


      # --------------------------------------------------
      # 3. Verify Docker
      # --------------------------------------------------
      - name: Verify Docker
        shell: powershell
        run: |

          Write-Host "Docker from PATH:"
          where.exe docker

          Write-Host ""
          Write-Host "Docker version:"
          docker version


      # --------------------------------------------------
      # 4. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------
      # 5. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        shell: powershell
        run: |

          docker build `
            -t jai842/sample-app:latest `
            .


      # --------------------------------------------------
      # 6. Push Docker image
      # --------------------------------------------------
      - name: Push Docker image
        shell: powershell
        run: |

          docker push jai842/sample-app:latest


      # --------------------------------------------------
      # 7. Configure Kubernetes
      # --------------------------------------------------
      - name: Configure Kubernetes
        shell: powershell
        run: |

          $kubeConfig = "C:\Users\BoggalaSaiJayaram\.kube\config"

          if (!(Test-Path $kubeConfig)) {
              Write-Error "Kubeconfig not found:"
              Write-Error $kubeConfig
              exit 1
          }

          Write-Host "Kubeconfig found."

          # Make kubeconfig available to following steps
          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "KUBECONFIG=$kubeConfig"

          Write-Host ""
          Write-Host "Current Kubernetes context:"

          kubectl config current-context

          Write-Host ""
          Write-Host "Kubernetes nodes:"

          kubectl get nodes


      # --------------------------------------------------
      # 8. Deploy Kubernetes Deployment
      # --------------------------------------------------
      - name: Deploy Application
        shell: powershell
        run: |

          kubectl apply `
            -f k8s/deployment.yaml


      # --------------------------------------------------
      # 9. Deploy Kubernetes Service
      # --------------------------------------------------
      - name: Deploy Service
        shell: powershell
        run: |

          kubectl apply `
            -f k8s/service.yaml


      # --------------------------------------------------
      # 10. Restart Kubernetes deployment
      # --------------------------------------------------
      - name: Restart Deployment
        shell: powershell
        run: |

          kubectl rollout restart deployment/sample-app


      # --------------------------------------------------
      # 11. Wait for deployment
      # --------------------------------------------------
      - name: Wait for Deployment
        shell: powershell
        run: |

          kubectl rollout status deployment/sample-app --timeout=120s


      # --------------------------------------------------
      # 12. Check final Kubernetes resources
      # --------------------------------------------------
      - name: Check Kubernetes
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== DEPLOYMENTS =========="

          kubectl get deployments

          Write-Host ""
          Write-Host "========== PODS =========="

          kubectl get pods -o wide

          Write-Host ""
          Write-Host "========== SERVICES =========="

          kubectl get services