name: Build Push and Deploy

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the type of release"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sample-app-release
  cancel-in-progress: false

jobs:
  build-push-deploy:

    runs-on: self-hosted

    steps:

      # ==================================================
      # 1. Checkout code
      # ==================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # 2. Configure Docker
      # ==================================================
      - name: Configure Docker
        shell: powershell
        run: |
          $dockerPath = "C:\Users\BoggalaSaiJayaram\AppData\Local\Programs\DockerDesktop\resources\bin"
          $dockerExe = "$dockerPath\docker.exe"

          if (!(Test-Path $dockerExe)) {
              Write-Error "Docker executable not found: $dockerExe"
              exit 1
          }

          Write-Host "Docker executable found:"
          Write-Host $dockerExe

          Add-Content -Path $env:GITHUB_PATH -Value $dockerPath

      # ==================================================
      # 3. Verify Docker
      # ==================================================
      - name: Verify Docker
        shell: powershell
        run: |
          Write-Host "Docker location:"
          where.exe docker

          Write-Host ""
          Write-Host "Docker version:"
          docker version

      # ==================================================
      # 4. Login to Docker Hub
      # ==================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==================================================
      # 5. Read current version
      # ==================================================
      - name: Read Current Version
        shell: powershell
        run: |

          if (!(Test-Path VERSION)) {
              Write-Error "VERSION file not found."
              exit 1
          }

          $currentVersion = (Get-Content VERSION).Trim()

          Write-Host "Current version: $currentVersion"

          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "VERSION must use MAJOR.MINOR.PATCH format."
              exit 1
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "CURRENT_VERSION=$currentVersion"

      # ==================================================
      # 6. Calculate next Semantic Version
      # ==================================================
      - name: Calculate Next Version
        shell: powershell
        run: |

          $current = "${{ env.CURRENT_VERSION }}"

          $parts = $current.Split('.')

          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $releaseType = "${{ inputs.release_type }}"

          # For normal push to main, use PATCH
          if ([string]::IsNullOrWhiteSpace($releaseType)) {
              $releaseType = "patch"
          }

          Write-Host "Release type: $releaseType"

          switch ($releaseType) {

              "major" {
                  $major++
                  $minor = 0
                  $patch = 0
              }

              "minor" {
                  $minor++
                  $patch = 0
              }

              "patch" {
                  $patch++
              }

              default {
                  Write-Error "Invalid release type: $releaseType"
                  exit 1
              }
          }

          $newVersion = "$major.$minor.$patch"

          Write-Host "Current version : $current"
          Write-Host "New version     : $newVersion"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "IMAGE_VERSION=$newVersion"

      # ==================================================
      # 7. Update VERSION file
      # ==================================================
      - name: Update VERSION file
        shell: powershell
        run: |

          $version = "${{ env.IMAGE_VERSION }}"

          Write-Host "Updating VERSION file to:"
          Write-Host $version

          Set-Content `
            -Path VERSION `
            -Value $version

      # ==================================================
      # 8. Build Docker image
      # ==================================================
      - name: Build Docker Image
        shell: powershell
        run: |

          Write-Host "Building Docker image:"
          Write-Host "jai842/sample-app:${{ env.IMAGE_VERSION }}"

          docker build `
            -t jai842/sample-app:${{ env.IMAGE_VERSION }} `
            -t jai842/sample-app:latest .

      # ==================================================
      # 9. Verify Docker images
      # ==================================================
      - name: Verify Docker Images
        shell: powershell
        run: |

          docker images jai842/sample-app

      # ==================================================
      # 10. Push versioned Docker image
      # ==================================================
      - name: Push Versioned Docker Image
        shell: powershell
        run: |

          Write-Host "Pushing:"
          Write-Host "jai842/sample-app:${{ env.IMAGE_VERSION }}"

          docker push jai842/sample-app:${{ env.IMAGE_VERSION }}

      # ==================================================
      # 11. Push latest Docker image
      # ==================================================
      - name: Push Latest Docker Image
        shell: powershell
        run: |

          Write-Host "Pushing latest image."

          docker push jai842/sample-app:latest

      # ==================================================
      # 12. Configure Kubernetes
      # ==================================================
      - name: Configure Kubernetes
        shell: powershell
        run: |

          $kubeConfig = "C:\Users\BoggalaSaiJayaram\.kube\config"

          if (!(Test-Path $kubeConfig)) {
              Write-Error "Kubeconfig not found: $kubeConfig"
              exit 1
          }

          $env:KUBECONFIG = $kubeConfig

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "KUBECONFIG=$kubeConfig"

          kubectl config use-context docker-desktop

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not select docker-desktop context."
              exit 1
          }

          Write-Host ""
          Write-Host "Current Kubernetes context:"

          kubectl config current-context

          Write-Host ""
          Write-Host "Kubernetes nodes:"

          kubectl get nodes

      # ==================================================
      # 13. Apply Deployment YAML
      # ==================================================
      - name: Deploy Application
        shell: powershell
        run: |

          kubectl apply -f k8s/deployment.yaml

      # ==================================================
      # 14. Apply Service YAML
      # ==================================================
      - name: Deploy Service
        shell: powershell
        run: |

          kubectl apply -f k8s/service.yaml

      # ==================================================
      # 15. Deploy Semantic Version
      # ==================================================
      - name: Update Deployment Image
        shell: powershell
        run: |

          Write-Host "Deploying:"
          Write-Host "jai842/sample-app:${{ env.IMAGE_VERSION }}"

          kubectl set image deployment/sample-app `
            nginx=jai842/sample-app:${{ env.IMAGE_VERSION }}

      # ==================================================
      # 16. Wait for Kubernetes rollout
      # ==================================================
      - name: Wait for Deployment
        shell: powershell
        run: |

          kubectl rollout status deployment/sample-app --timeout=180s

      # ==================================================
      # 17. Create Git tag
      # ==================================================
      - name: Create Git Tag
        shell: powershell
        run: |

          $version = "${{ env.IMAGE_VERSION }}"

          $tag = "v$version"

          Write-Host "Creating Git tag:"
          Write-Host $tag

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION

          git commit `
            -m "Release $version" `
            --allow-empty

          git tag $tag

          git push origin HEAD:main

          git push origin $tag

      # ==================================================
      # 18. Display final resources
      # ==================================================
      - name: Check Kubernetes Resources
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT"
          Write-Host "======================================"

          kubectl get deployment sample-app

          Write-Host ""
          Write-Host "======================================"
          Write-Host "PODS"
          Write-Host "======================================"

          kubectl get pods -o wide

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SERVICES"
          Write-Host "======================================"

          kubectl get services

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CURRENT IMAGE"
          Write-Host "======================================"

          kubectl get deployment sample-app `
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host ""