name: Build Push and Deploy

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  build-push-deploy:

    # Run only when the Pull Request was actually merged
    if: github.event.pull_request.merged == true

    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. Checkout the merged code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Configure Docker
      # --------------------------------------------------
      - name: Configure Docker
        shell: powershell
        run: |

          $dockerPath = "C:\Users\BoggalaSaiJayaram\AppData\Local\Programs\DockerDesktop\resources\bin"
          $dockerExe = "$dockerPath\docker.exe"

          Write-Host "Checking Docker:"
          Write-Host $dockerExe

          if (-not (Test-Path $dockerExe)) {
              Write-Error "Docker executable not found at $dockerExe"
              exit 1
          }

          # Add Docker to PATH for the current step
          $env:Path = "$dockerPath;$env:Path"

          # Add Docker to PATH for subsequent steps
          Add-Content $env:GITHUB_PATH $dockerPath

          Write-Host "Docker version:"
          & $dockerExe --version

          Write-Host "Docker command test:"
          docker --version


      # --------------------------------------------------
      # 3. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------
      # 4. Read current VERSION
      # --------------------------------------------------
      - name: Read VERSION
        shell: powershell
        run: |

          if (-not (Test-Path "VERSION")) {
              Write-Error "VERSION file not found!"
              exit 1
          }

          $currentVersion = (Get-Content VERSION -Raw).Trim()

          Write-Host "Current version: $currentVersion"

          # Validate Semantic Version format
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "VERSION must follow Semantic Versioning format, for example 1.0.0"
              exit 1
          }

          "CURRENT_VERSION=$currentVersion" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append


      # --------------------------------------------------
      # 5. Determine release type from branch name
      # --------------------------------------------------
      - name: Determine Release Type
        shell: powershell
        run: |

          $branchName = "${{ github.event.pull_request.head.ref }}"

          Write-Host "Source branch: $branchName"

          if ($branchName -like "major/*") {

              $releaseType = "major"

          }
          elseif ($branchName -like "minor/*") {

              $releaseType = "minor"

          }
          elseif ($branchName -like "patch/*") {

              $releaseType = "patch"

          }
          else {

              Write-Error "Invalid branch name: $branchName"
              Write-Error "Branch name must start with major/, minor/, or patch/"
              exit 1
          }

          Write-Host "Release type: $releaseType"

          "RELEASE_TYPE=$releaseType" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append


      # --------------------------------------------------
      # 6. Calculate next Semantic Version
      # --------------------------------------------------
      - name: Calculate Next Version
        shell: powershell
        run: |

          $versionParts = $env:CURRENT_VERSION.Split('.')

          $major = [int]$versionParts[0]
          $minor = [int]$versionParts[1]
          $patch = [int]$versionParts[2]

          switch ($env:RELEASE_TYPE) {

              "major" {

                  $major++
                  $minor = 0
                  $patch = 0
              }

              "minor" {

                  $minor++
                  $patch = 0
              }

              "patch" {

                  $patch++
              }

              default {

                  Write-Error "Invalid release type: $env:RELEASE_TYPE"
                  exit 1
              }
          }

          $newVersion = "$major.$minor.$patch"

          Write-Host "Current version : $env:CURRENT_VERSION"
          Write-Host "Release type    : $env:RELEASE_TYPE"
          Write-Host "New version     : $newVersion"

          "VERSION=$newVersion" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append


      # --------------------------------------------------
      # 7. Update VERSION file
      # --------------------------------------------------
      - name: Update VERSION file
        shell: powershell
        run: |

          Set-Content `
            -Path VERSION `
            -Value $env:VERSION `
            -NoNewline

          Write-Host "VERSION file updated to:"
          Get-Content VERSION


      # --------------------------------------------------
      # 8. Build Docker image
      # --------------------------------------------------
      - name: Build Docker Image
        shell: powershell
        run: |

          Write-Host "Building Docker image..."

          docker build `
            -t "jai842/sample-app:$env:VERSION" `
            -t "jai842/sample-app:latest" `
            .


      # --------------------------------------------------
      # 9. Push Docker images to Docker Hub
      # --------------------------------------------------
      - name: Push Docker Image
        shell: powershell
        run: |

          Write-Host "Pushing version: $env:VERSION"

          docker push "jai842/sample-app:$env:VERSION"

          Write-Host "Pushing latest..."

          docker push "jai842/sample-app:latest"


      # --------------------------------------------------
      # 10. Configure Kubernetes
      # --------------------------------------------------
      - name: Configure Kubernetes
        shell: powershell
        run: |

          $kubeConfig = "C:\Users\BoggalaSaiJayaram\.kube\config"

          if (-not (Test-Path $kubeConfig)) {
              Write-Error "Kubeconfig not found at $kubeConfig"
              exit 1
          }

          $env:KUBECONFIG = $kubeConfig

          "KUBECONFIG=$kubeConfig" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          kubectl config use-context docker-desktop

          Write-Host "Current Kubernetes context:"
          kubectl config current-context

          Write-Host "Kubernetes nodes:"
          kubectl get nodes


      # --------------------------------------------------
      # 11. Deploy Kubernetes resources
      # --------------------------------------------------
      - name: Deploy Kubernetes Resources
        shell: powershell
        run: |

          kubectl apply -f k8s/deployment.yaml

          kubectl apply -f k8s/service.yaml


      # --------------------------------------------------
      # 12. Update Kubernetes deployment to exact version
      # --------------------------------------------------
      - name: Update Kubernetes Image
        shell: powershell
        run: |

          Write-Host "Updating Kubernetes deployment to:"
          Write-Host "jai842/sample-app:$env:VERSION"

          kubectl set image deployment/sample-app `
            nginx="jai842/sample-app:$env:VERSION"


      # --------------------------------------------------
      # 13. Wait for deployment
      # --------------------------------------------------
      - name: Wait for Deployment
        shell: powershell
        run: |

          kubectl rollout status deployment/sample-app `
            --timeout=180s


      # --------------------------------------------------
      # 14. Check Kubernetes resources
      # --------------------------------------------------
      - name: Check Kubernetes Resources
        shell: powershell
        run: |

          Write-Host "Pods:"
          kubectl get pods -o wide

          Write-Host ""

          Write-Host "Deployment:"
          kubectl get deployment sample-app

          Write-Host ""

          Write-Host "Service:"
          kubectl get service sample-app-service


      # --------------------------------------------------
      # 15. Configure Git safe directory
      # --------------------------------------------------
      - name: Configure Git Safe Directory
        shell: powershell
        run: |

          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

          Write-Host "Git safe directory configured:"
          Write-Host "$env:GITHUB_WORKSPACE"


      # --------------------------------------------------
      # 16. Configure Git identity
      # --------------------------------------------------
      - name: Configure Git Identity
        shell: powershell
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # --------------------------------------------------
      # 17. Commit updated VERSION file
      # --------------------------------------------------
      - name: Commit VERSION
        shell: powershell
        run: |

          git add VERSION

          if (git diff --cached --quiet) {

              Write-Host "No VERSION changes to commit."

          }
          else {

              git commit -m "chore: release $env:VERSION [skip ci]"

              git push origin HEAD:main
          }


      # --------------------------------------------------
      # 18. Final release summary
      # --------------------------------------------------
      - name: Release Summary
        shell: powershell
        run: |

          Write-Host "========================================="
          Write-Host "        RELEASE COMPLETED"
          Write-Host "========================================="
          Write-Host ""

          Write-Host "Source Branch      : ${{ github.event.pull_request.head.ref }}"
          Write-Host "Release Type       : $env:RELEASE_TYPE"
          Write-Host "Application Version: $env:VERSION"
          Write-Host "Docker Image       : jai842/sample-app:$env:VERSION"
          Write-Host "Docker Latest      : jai842/sample-app:latest"

          Write-Host ""
          Write-Host "Kubernetes Deployment:"

          kubectl get deployment sample-app

          Write-Host ""
          Write-Host "========================================="