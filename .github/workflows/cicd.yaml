name: Build Push and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-push-deploy:

    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify Docker
      - name: Verify Docker
        shell: powershell
        run: |
          Write-Host "Docker location:"
          where.exe docker

          Write-Host "Docker version:"
          docker version

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Docker image
      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t jai842/sample-app:latest .

      # 5. Push Docker image to Docker Hub
      - name: Push Docker image
        shell: powershell
        run: |
          docker push jai842/sample-app:latest

      # 6. Configure Docker Desktop Kubernetes
      - name: Configure Kubernetes
        shell: powershell
        run: |
          $kubeConfig = "C:\Users\BoggalaSaiJayaram\.kube\config"

          Write-Host "Checking kubeconfig..."
          
          if (!(Test-Path $kubeConfig)) {
              Write-Error "Kubeconfig not found: $kubeConfig"
              exit 1
          }

          Write-Host "Kubeconfig found."
          
          $env:KUBECONFIG = $kubeConfig
          
          Add-Content -Path $env:GITHUB_ENV -Value "KUBECONFIG=$kubeConfig"

          Write-Host "Current Kubernetes context:"
          kubectl config current-context

          Write-Host "Kubernetes nodes:"
          kubectl get nodes

      # 7. Deploy Kubernetes Deployment
      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl apply -f k8s/deployment.yaml

      # 8. Deploy Kubernetes Service
      - name: Deploy Kubernetes Service
        shell: powershell
        run: |
          kubectl apply -f k8s/service.yaml

      # 9. Restart deployment to pull latest image
      - name: Restart Kubernetes deployment
        shell: powershell
        run: |
          kubectl rollout restart deployment/sample-app

      # 10. Wait for deployment
      - name: Wait for deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/sample-app --timeout=120s

      # 11. Check Kubernetes resources
      - name: Check Kubernetes resources
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services