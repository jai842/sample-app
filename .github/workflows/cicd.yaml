name: Build Push and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-push-deploy:

    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Define Docker executable
      - name: Set Docker path
        shell: powershell
        run: |
          $docker = "C:\Users\BoggalaSaiJayaram\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"

          if (!(Test-Path $docker)) {
              Write-Error "Docker executable not found"
              exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_EXE=$docker"

          Write-Host "Docker executable found"


      # 3. Verify Docker
      - name: Verify Docker
        shell: powershell
        run: |
          & $env:DOCKER_EXE version


      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 5. Build Docker image
      - name: Build Docker image
        shell: powershell
        run: |
          & $env:DOCKER_EXE build `
            -t jai842/sample-app:latest `
            .


      # 6. Push image to Docker Hub
      - name: Push Docker image
        shell: powershell
        run: |
          & $env:DOCKER_EXE push `
            jai842/sample-app:latest


      # 7. Configure Kubernetes
      - name: Configure Kubernetes
        shell: powershell
        run: |

          $kubeConfig = "C:\Users\BoggalaSaiJayaram\.kube\config"

          if (!(Test-Path $kubeConfig)) {
              Write-Error "Kubeconfig not found"
              exit 1
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "KUBECONFIG=$kubeConfig"

          Write-Host "Kubernetes context:"
          kubectl config current-context

          Write-Host "Kubernetes nodes:"
          kubectl get nodes


      # 8. Deploy application
      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml


      # 9. Restart deployment
      - name: Restart Kubernetes deployment
        shell: powershell
        run: |
          kubectl rollout restart deployment/sample-app


      # 10. Wait for deployment
      - name: Wait for deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/sample-app --timeout=120s


      # 11. Check Kubernetes
      - name: Check Kubernetes resources
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services