name: Build Push and Deploy

on:
  push:
    branches:
      - main

# Prevent two releases from calculating the same version
concurrency:
  group: sample-app-release
  cancel-in-progress: false

# Required to create Git tags
permissions:
  contents: write

jobs:
  build-push-deploy:

    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. Checkout source code and Git tags
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Configure Docker
      # --------------------------------------------------
      - name: Configure Docker
        shell: powershell
        run: |
          $dockerPath = "C:\Users\BoggalaSaiJayaram\AppData\Local\Programs\DockerDesktop\resources\bin"
          $dockerExe = "$dockerPath\docker.exe"

          if (!(Test-Path $dockerExe)) {
              Write-Error "Docker executable not found: $dockerExe"
              exit 1
          }

          Write-Host "Docker executable found:"
          Write-Host $dockerExe

          Add-Content -Path $env:GITHUB_PATH -Value $dockerPath

      # --------------------------------------------------
      # 3. Verify Docker
      # --------------------------------------------------
      - name: Verify Docker
        shell: powershell
        run: |
          Write-Host "Docker location:"
          where.exe docker

          Write-Host ""
          Write-Host "Docker version:"
          docker version

      # --------------------------------------------------
      # 4. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 5. Generate v1, v2, v3...
      # --------------------------------------------------
      - name: Generate Image Version
        shell: powershell
        run: |

          Write-Host "Checking existing Git version tags..."

          git fetch --tags

          $tags = git tag --list "v*" |
            Where-Object { $_ -match '^v[0-9]+$' }

          if ($tags.Count -eq 0) {
              $nextVersion = 1
          }
          else {
              $numbers = $tags |
                ForEach-Object {
                    [int]($_ -replace '^v', '')
                }

              $nextVersion = ($numbers | Measure-Object -Maximum).Maximum + 1
          }

          $version = "v$nextVersion"

          Write-Host "New image version: $version"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "IMAGE_VERSION=$version"

      # --------------------------------------------------
      # 6. Build Docker image
      # --------------------------------------------------
      - name: Build Docker Image
        shell: powershell
        run: |

          Write-Host "Building Docker image..."

          docker build `
            -t jai842/sample-app:${{ env.IMAGE_VERSION }} `
            -t jai842/sample-app:latest .

      # --------------------------------------------------
      # 7. Verify Docker images
      # --------------------------------------------------
      - name: Verify Docker Images
        shell: powershell
        run: |

          Write-Host "Docker images created:"

          docker images jai842/sample-app

      # --------------------------------------------------
      # 8. Push versioned image
      # --------------------------------------------------
      - name: Push Versioned Docker Image
        shell: powershell
        run: |

          Write-Host "Pushing:"
          Write-Host "jai842/sample-app:${{ env.IMAGE_VERSION }}"

          docker push jai842/sample-app:${{ env.IMAGE_VERSION }}

      # --------------------------------------------------
      # 9. Push latest image
      # --------------------------------------------------
      - name: Push Latest Docker Image
        shell: powershell
        run: |

          Write-Host "Pushing:"
          Write-Host "jai842/sample-app:latest"

          docker push jai842/sample-app:latest

      # --------------------------------------------------
      # 10. Create Git version tag
      # --------------------------------------------------
      - name: Create Git Version Tag
        shell: powershell
        run: |

          Write-Host "Creating Git tag:"
          Write-Host "${{ env.IMAGE_VERSION }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag ${{ env.IMAGE_VERSION }}

          git push origin ${{ env.IMAGE_VERSION }}

      # --------------------------------------------------
      # 11. Configure Kubernetes
      # --------------------------------------------------
      - name: Configure Kubernetes
        shell: powershell
        run: |

          $kubeConfig = "C:\Users\BoggalaSaiJayaram\.kube\config"

          if (!(Test-Path $kubeConfig)) {
              Write-Error "Kubeconfig not found: $kubeConfig"
              exit 1
          }

          Write-Host "Kubeconfig found:"
          Write-Host $kubeConfig

          $env:KUBECONFIG = $kubeConfig

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "KUBECONFIG=$kubeConfig"

          Write-Host ""
          Write-Host "Kubernetes contexts:"

          kubectl config get-contexts

          Write-Host ""
          Write-Host "Selecting Docker Desktop context:"

          kubectl config use-context docker-desktop

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not select docker-desktop context."
              exit 1
          }

          Write-Host ""
          Write-Host "Current Kubernetes context:"

          kubectl config current-context

          Write-Host ""
          Write-Host "Kubernetes nodes:"

          kubectl get nodes

      # --------------------------------------------------
      # 12. Apply Deployment YAML
      # --------------------------------------------------
      - name: Deploy Application
        shell: powershell
        run: |

          kubectl apply -f k8s/deployment.yaml

      # --------------------------------------------------
      # 13. Apply Service YAML
      # --------------------------------------------------
      - name: Deploy Service
        shell: powershell
        run: |

          kubectl apply -f k8s/service.yaml

      # --------------------------------------------------
      # 14. Change live Deployment to v1/v2/v3...
      # --------------------------------------------------
      - name: Update Deployment Image
        shell: powershell
        run: |

          Write-Host "Deploying image:"
          Write-Host "jai842/sample-app:${{ env.IMAGE_VERSION }}"

          kubectl set image deployment/sample-app `
            nginx=jai842/sample-app:${{ env.IMAGE_VERSION }}

      # --------------------------------------------------
      # 15. Wait for rollout
      # --------------------------------------------------
      - name: Wait for Deployment
        shell: powershell
        run: |

          kubectl rollout status deployment/sample-app --timeout=180s

      # --------------------------------------------------
      # 16. Check Kubernetes resources
      # --------------------------------------------------
      - name: Check Kubernetes Resources
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENTS"
          Write-Host "======================================"

          kubectl get deployments

          Write-Host ""
          Write-Host "======================================"
          Write-Host "PODS"
          Write-Host "======================================"

          kubectl get pods -o wide

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SERVICES"
          Write-Host "======================================"

          kubectl get services

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CURRENT IMAGE"
          Write-Host "======================================"

          kubectl get deployment sample-app `
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host ""